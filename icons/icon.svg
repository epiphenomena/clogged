<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="casing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="0.2" stop-color="#42527d"/>
      <stop offset="0.55" stop-color="#28324f"/>
      <stop offset="1" stop-color="#161d33"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff3e6"/>
      <stop offset="0.45" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0c6a60"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd77f"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#8a5206"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c4dd"/>
      <stop offset="0.5" stop-color="#69769a"/>
      <stop offset="1" stop-color="#3d4767"/>
    </linearGradient>
    <radialGradient id="grime" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f7c0ff"/>
      <stop offset="0.55" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#8a1fa1"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- pipe casing -->
  <rect x="104" y="72" width="304" height="368" rx="40" fill="url(#casing)"/>
  <rect x="146" y="106" width="220" height="300" rx="12" fill="#070a14"/>

  <!-- rivets -->
  <g fill="rgba(255,255,255,0.16)">
    <circle cx="125" cy="160" r="8"/><circle cx="125" cy="256" r="8"/><circle cx="125" cy="352" r="8"/>
    <circle cx="387" cy="160" r="8"/><circle cx="387" cy="256" r="8"/><circle cx="387" cy="352" r="8"/>
  </g>

  <!-- horizontal coupler: two halves joined by a collar -->
  <g>
    <path d="M170 146 h74 v82 h-74 a24 24 0 0 1 -24 -24 v-34 a24 24 0 0 1 24 -24 z" fill="url(#teal)"/>
    <path d="M268 146 h74 a24 24 0 0 1 24 24 v34 a24 24 0 0 1 -24 24 h-74 z" fill="url(#amber)"/>
    <rect x="244" y="152" width="24" height="70" fill="url(#collar)"/>
    <circle cx="196" cy="187" r="17" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="9"/>
    <path d="M298 187 h32" stroke="rgba(255,255,255,0.6)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- grime blob wedged at the bottom -->
  <g>
    <path d="M256 268 c34 0 62 14 70 40 c8 26 -4 56 -30 68 c-26 12 -62 12 -88 0 c-26 -12 -38 -42 -30 -68 c8 -26 44 -40 78 -40 z"
          fill="url(#grime)" stroke="rgba(0,0,0,0.4)" stroke-width="8"/>
    <g fill="rgba(255,255,255,0.22)">
      <circle cx="228" cy="322" r="11"/><circle cx="272" cy="344" r="8"/><circle cx="288" cy="308" r="6"/>
    </g>
    <g stroke="rgba(255,255,255,0.6)" stroke-width="9" stroke-linecap="round">
      <path d="M241 316 l30 30"/><path d="M271 316 l-30 30"/>
    </g>
  </g>
</svg>
